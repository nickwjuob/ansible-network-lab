---
- name: Initialize per-case status and decision
  ansible.builtin.set_fact:
    lifecycle_status: NOT_STARTED
    change_gate_decision: >-
      {{
        'BLOCK'
        if not (lifecycle_case.check_complete | bool)
        or lifecycle_case.initial_health == 'UNKNOWN'
        else
        'SKIP_NO_CHANGE'
        if lifecycle_case.initial_health == 'HEALTHY'
        else
        'ALLOW_REMEDIATION'
        if lifecycle_case.initial_health == 'UNHEALTHY'
        else
        'BLOCK'
      }}

- name: Run guarded lifecycle
  when: change_gate_decision == 'ALLOW_REMEDIATION'
  block:
    - name: Simulate remediation
      ansible.builtin.debug:
        msg: "{{ lifecycle_case.device }} remediation executed"
      changed_when: lifecycle_case.change_succeeds | bool
      failed_when: not (lifecycle_case.change_succeeds | bool)

    - name: Simulate post-check
      ansible.builtin.debug:
        msg: "{{ lifecycle_case.device }} post-check"
      failed_when: not (lifecycle_case.postcheck_healthy | bool)

    - name: Record successful result
      ansible.builtin.set_fact:
        lifecycle_status: SUCCESS

  rescue:
    - name: Attempt simulated recovery
      block:
        - name: Simulate recovery attempt
          ansible.builtin.debug:
            msg: "{{ lifecycle_case.device }} recovery attempted"
          failed_when: not (lifecycle_case.recovery_succeeds | bool)

        - name: Record recovered result
          ansible.builtin.set_fact:
            lifecycle_status: RECOVERED

      rescue:
        - name: Record recovery failure result
          ansible.builtin.set_fact:
            lifecycle_status: RECOVERY_FAILED

- name: Record no-change result
  ansible.builtin.set_fact:
    lifecycle_status: SKIP_NO_CHANGE
  when: change_gate_decision == 'SKIP_NO_CHANGE'

- name: Record blocked result
  ansible.builtin.set_fact:
    lifecycle_status: BLOCKED
  when: change_gate_decision == 'BLOCK'

- name: Display final case result
  ansible.builtin.debug:
    msg:
      device: "{{ lifecycle_case.device }}"
      decision: "{{ change_gate_decision }}"
      final_status: "{{ lifecycle_status }}"

- name: Append this device result to fleet collection
  ansible.builtin.set_fact:
    fleet_results: >-
      {{
        fleet_results
        +
        [
          {
            'device': lifecycle_case.device,
            'decision': change_gate_decision,
            'status': lifecycle_status,
            'initial_health': lifecycle_case.initial_health
          }
        ]
      }}
