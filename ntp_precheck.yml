
---
- name: Pre-check NTP configuration on Cisco IOS routers
  hosts: cisco_routers
  gather_facts: false

  tasks:
    - name: Read and normalize NTP configuration
      ansible.builtin.import_tasks: tasks/ntp_read_config.yml

    - name: Classify pre-check result
      ansible.builtin.import_tasks: tasks/ntp_classify_result.yml

    - name: Display pre-check result
      ansible.builtin.debug:
        msg:
          device: "{{ inventory_hostname }}"
          status: "{{ ntp_precheck_status }}"
          ntp_config_lines: "{{ ntp_precheck_lines }}"

    - name: Simulate configuration stage only when pre-check is READY
      ansible.builtin.debug:
        msg: >-
          SIMULATION ONLY: {{ inventory_hostname }} passed pre-check.
          A configuration task would be allowed to proceed.
      when: ntp_precheck_status == 'READY'

    - name: Report devices blocked by pre-check
      ansible.builtin.debug:
        msg: >-
          BLOCKED: {{ inventory_hostname }} is not allowed to proceed.
          Pre-check status: {{ ntp_precheck_status }}
      when: ntp_precheck_status != 'READY'
