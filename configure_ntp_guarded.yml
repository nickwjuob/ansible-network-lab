
---
- name: Guarded NTP configuration workflow
  hosts: cisco_routers
  gather_facts: false

  tasks:
    - name: Pre-check - read configured NTP servers
      ansible.builtin.import_tasks: tasks/ntp_read_config.yml

    - name: Classify pre-check result
      ansible.builtin.import_tasks: tasks/ntp_classify_result.yml

    - name: Change - configure NTP only when missing
      cisco.ios.ios_config:
        lines:
          - "ntp server {{ desired_ntp_server }}"
        match: line
        replace: line
        diff_against: running
        backup: false
      when: ntp_precheck_status == 'CONFIG_MISSING'

    - name: Post-check - read configured NTP servers
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^ntp server"
      register: ntp_postcheck_result
      when:
        - not ansible_check_mode
        - ntp_precheck_status in ['CONFIG_MISSING', 'READY']

    - name: Verify desired NTP configuration
      ansible.builtin.assert:
        that:
          - >-
            ntp_postcheck_result.stdout_lines[0]
            | default([])
            | select('search', '^ntp server ' ~ desired_ntp_server ~ '$')
            | list
            | length > 0
        success_msg: "Post-check passed: desired NTP server is configured."
        fail_msg: "Post-check failed: desired NTP server was not found."
      when:
        - not ansible_check_mode
        - ntp_precheck_status in ['CONFIG_MISSING', 'READY']

    - name: Display workflow result
      ansible.builtin.debug:
        msg:
          device: "{{ inventory_hostname }}"
          precheck_status: "{{ ntp_precheck_status }}"
          change_eligible: "{{ ntp_precheck_status == 'CONFIG_MISSING' }}"
          postcheck_performed: "{{ (not ansible_check_mode) and (ntp_precheck_status in ['CONFIG_MISSING', 'READY']) }}"
          postcheck_lines: >-
            {{
              ntp_postcheck_result.stdout_lines[0] | default([])
              if (
                not ansible_check_mode
                and ntp_precheck_status in ['CONFIG_MISSING', 'READY']
              )
              else []
            }}
