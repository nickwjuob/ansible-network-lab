name: Network Data CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-network-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install PyYAML==6.0.2

      - name: Validate network device data
        run: python scripts/validate_devices.py

      - name: Generate Ansible inventory
        run: python scripts/generate_inventory.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Verify inventory is up to date
        run: git diff --exit-code -- inventory.ini

  terraform-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: iac-lab/local-baseline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize providers without backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate Terraform configuration
        run: terraform validate -no-color
