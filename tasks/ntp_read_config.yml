---
- name: Read configured NTP servers
  cisco.ios.ios_command:
    commands:
      - "show running-config | include ^ntp server"
  register: ntp_precheck_result
  ignore_errors: true
  ignore_unreachable: true

- name: Normalize NTP command output
  ansible.builtin.set_fact:
    ntp_precheck_lines: >-
      {{
        ntp_precheck_result.stdout_lines
        | default([])
        | first
        | default([])
        | map('trim')
        | reject('equalto', '')
        | list
      }}
